[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codevoight"
version = "0.1.0"
description = "Voight-Kampff Human Comprehension Gate for AI Coding Agents and Git Commits"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "CodeVoight Contributors" }
]
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.6.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
codevoight = "codevoight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
