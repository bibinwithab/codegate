[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codegate"
version = "0.1.0"
description = "Universal Quiz-Gated MCP Commit Server and Git Enforcement Gate"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "CodeGate Contributors" }
]
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.6.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
codegate = "codegate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
